name: mysql-replication-lab
services:
  mysql-master:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: shopdb
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    volumes:
      - master_data:/var/lib/mysql
      - ./master-conf/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -e "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-replica:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    volumes:
      - replica_data:/var/lib/mysql
      - ./replica-conf/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -e "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  master_data:
  replica_data:
